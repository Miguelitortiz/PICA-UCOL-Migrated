server {
    listen 80;
    server_name localhost;

    location /admin {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # La raíz del sistema vive en StudentHUB; si alguien toca este contenedor directamente,
    # devolvemos al sitio principal en lugar de empujar otra vez a Admin.
    location = / {
        return 302 /;
    }
}
