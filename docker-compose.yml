version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: pica-postgres
    restart: always
    environment:
      POSTGRES_DB: pica_db
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: pica-auth-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/pica_db
      JWT_SECRET: ${JWT_SECRET:-pica-ucol-jwt-secret-2026}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Professors Service
  professors-service:
    build:
      context: ./services/professors-service
      dockerfile: Dockerfile
    container_name: pica-professors-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/pica_db
      JWT_SECRET: ${JWT_SECRET:-pica-ucol-jwt-secret-2026}
      CV_EXTRACTOR_URL: http://cv-extractor-service:6774
      REFERENCE_SERVICE_URL: http://reference-service:6773
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Academic Service
  academic-service:
    build:
      context: ./services/academic-service
      dockerfile: Dockerfile
    container_name: pica-academic-service
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/pica_db
      JWT_SECRET: ${JWT_SECRET:-pica-ucol-jwt-secret-2026}
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Reference Service
  reference-service:
    build:
      context: ./services/reference-service
      dockerfile: Dockerfile
    container_name: pica-reference-service
    restart: always
    depends_on:
      - postgres

  # 6. CV Extractor Service
  cv-extractor-service:
    build:
      context: ./services/cv-extractor-service
      dockerfile: Dockerfile
    container_name: pica-cv-extractor-service
    restart: always

  # 7. Redis
  redis:
    image: redis:7-alpine
    container_name: pica-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 8. Interfaz Administrativa (admin-hub-frontend)
  admin-hub-frontend:
    build:
      context: .
      dockerfile: services/admin-hub-frontend/Dockerfile
    container_name: pica-admin-hub-frontend
    restart: always
    depends_on:
      - auth-service
      - professors-service
      - academic-service

  # 9. StudentHUB Frontend (student-hub)
  student-hub:
    build:
      context: .
      dockerfile: services/student-hub/Dockerfile
      args:
        DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/pica_db
    container_name: pica-student-hub
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin_pass}@postgres:5432/pica_db
    depends_on:
      postgres:
        condition: service_healthy

  # 10. ProjectHUB Placeholder (project-hub)
  project-hub:
    build:
      context: .
      dockerfile: services/project-hub/Dockerfile
    container_name: pica-project-hub
    restart: always
    depends_on:
      - student-hub

  # 11. Proxy de Entrada (Nginx Reverse Proxy)
  proxy:
    build:
      context: ./services/proxy
      dockerfile: Dockerfile
    container_name: pica-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - proxy_cache:/var/cache/nginx
    depends_on:
      - student-hub
      - admin-hub-frontend
      - auth-service
      - professors-service
      - academic-service
      - reference-service
      - cv-extractor-service
      - project-hub

volumes:
  postgres_data:
    driver: local
  temp_uploads:
    driver: local
  proxy_cache:
    driver: local
  redis_data:
    driver: local
